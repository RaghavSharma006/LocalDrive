name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and package
        shell: pwsh
        run: ./Build-Standalone.ps1
      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $package = Get-ChildItem -Filter 'LocalDrive-*-Setup-win-x64.zip' | Select-Object -First 1
          $setup = Get-ChildItem -Filter 'LocalDrive-*-Setup-win-x64.exe' | Select-Object -First 1
          if (-not $package -or -not $setup) { throw 'The setup archive or one-click executable was not produced.' }
          gh release create $env:GITHUB_REF_NAME $setup.FullName $package.FullName --title "LocalDrive $env:GITHUB_REF_NAME" --generate-notes
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalDrive-Windows-x64
          path: |
            LocalDrive-*-Setup-win-x64.exe
            LocalDrive-*-Setup-win-x64.zip
