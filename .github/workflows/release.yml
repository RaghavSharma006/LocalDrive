name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-go@v5
        if: startsWith(github.ref, 'refs/tags/')
        with:
          go-version: '1.27.0'
          cache: false
      - name: Build compact TeraBox engine for tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $project = [xml](Get-Content LocalDrive.csproj -Raw)
          $version = $project.Project.PropertyGroup.Version
          $engine = Join-Path $env:RUNNER_TEMP "LocalDrive-Rclone-$version-win-x64.zip"
          $sha256 = ./Build-SlimRclone.ps1 -OutputPath $engine
          ./Build-Standalone.ps1 -RcloneArchivePath $engine -RcloneArchiveSha256 $sha256
      - name: Build and package
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: ./Build-Standalone.ps1
      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Filter 'LocalDrive-*-Setup-win-x64.exe' | Select-Object -First 1
          if (-not $setup) { throw 'The one-file setup executable was not produced.' }
          gh release create $env:GITHUB_REF_NAME $setup.FullName --title "LocalDrive $env:GITHUB_REF_NAME" --generate-notes
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalDrive-Windows-x64
          path: |
            LocalDrive-*-Setup-win-x64.exe
